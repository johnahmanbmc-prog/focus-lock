<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocked</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1a; --fg: #ecebe7; --muted: #a3a29d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; padding: 0 16px; text-align: center; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: .25rem 0; }
    code { font-size: .9em; }
  </style>
</head>
<body>
  <main>
    <h1>This page is blocked</h1>
    <p>Focus Lock blocked it so you can stay on track.</p>
    <p>Reason: <code id="reason">blocked</code></p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
