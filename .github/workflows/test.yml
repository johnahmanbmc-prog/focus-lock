name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check script syntax
        run: |
          for f in extension/*.js extension/lib/*.js app/*.js app/core/*.js app/ui/*.js; do node --check "$f"; done

  # Builds the Windows installer and a portable .exe. Download them from the
  # run's "Artifacts" section.
  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # WinSW runs the Focus Lock service. Pinned to a release.
      - name: Download WinSW
        shell: pwsh
        run: Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile app/admin/FocusLockService.exe
      - name: Zip the extension for the Chrome Web Store
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath app/dist-extension.zip
      - run: npm run dist
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-windows
          path: |
            app/dist/*.exe
            app/dist-extension.zip
          if-no-files-found: error
