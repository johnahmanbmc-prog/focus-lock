name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check script syntax
        run: |
          for f in app/*.js app/core/*.js app/ui/*.js; do node --check "$f"; done

  # Builds the Windows installer. Download them from the
  # run's "Artifacts" section.
  windows-app:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # WinSW runs the Focus Lock service. Pinned to a release.
      - name: Download WinSW
        shell: pwsh
        run: Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile app/admin/FocusLockService.exe
      - run: npm run dist
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-windows
          path: app/dist/*.exe
          if-no-files-found: error
      # On main, publish the installer as a GitHub Release so it has a
      # stable download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/FocusLock-Setup.exe
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem app/dist/FocusLock-Setup-*.exe | Select-Object -First 1
          Copy-Item $exe.FullName app/dist/FocusLock-Setup.exe
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" $exe.FullName app/dist/FocusLock-Setup.exe --clobber
          } else {
            gh release create "v$v" $exe.FullName app/dist/FocusLock-Setup.exe --target $env:GITHUB_SHA --title "Focus Lock $v" --notes "Windows installer. Setup is done by the person with the admin password: see docs/HELPER-SETUP.md."
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
