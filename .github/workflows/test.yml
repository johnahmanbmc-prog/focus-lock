name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check script syntax
        run: |
          for f in extension/*.js extension/lib/*.js app/*.js app/core/*.js app/ui/*.js; do node --check "$f"; done

  # Builds the Windows installer and a portable .exe. Download them from the
  # run's "Artifacts" section.
  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run dist
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-windows
          path: |
            app/dist/*.exe
          if-no-files-found: error
