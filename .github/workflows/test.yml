name: test

on:
  push:
  pull_request:

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check script syntax
        run: |
          for f in extension/*.js extension/lib/*.js; do node --check "$f"; done
